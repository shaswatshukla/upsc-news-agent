name: UPSC Daily Digest

on:
  schedule:
    # 7:00 AM IST = 01:30 UTC. GitHub cron is in UTC.
    - cron: "30 1 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IE_COOKIES_JSON: ${{ secrets.IE_COOKIES_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          GEMINI_RPM_SLEEP: "5.0"
          MAX_ARTICLES_PER_SECTION: "15"
          RELEVANCE_THRESHOLD: "6"
          TIMEZONE: "Asia/Kolkata"
          OUTPUT_DIR: "out"
        run: |
          cd src
          python main.py

      - name: Upload PDF artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upsc-pdf-${{ github.run_id }}
          path: src/out/*.pdf
          if-no-files-found: ignore
          retention-days: 14

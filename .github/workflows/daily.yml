name: Daily PIB UPSC Email

on:
  schedule:
    # 09:00 India time = 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "pib/**"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency:
  group: pib-daily-email
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pib/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r pib/requirements.txt
      - name: Generate and email PIB report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER || secrets.SMTP_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD || secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT || secrets.EMAIL_TO }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          GEMINI_MODEL: ${{ vars.PIB_GEMINI_MODEL || 'gemini-flash-latest' }}
          MAX_RELEASES: "25"
          PYTHONUNBUFFERED: "1"
        run: python pib/agent.py
      - name: Persist processed release history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pib/seen_prids.json
          if ! git diff --cached --quiet; then
            git commit -m "Save PIB release history [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pib-report-${{ github.run_id }}
          path: pib/*.pdf
          if-no-files-found: ignore
          retention-days: 7

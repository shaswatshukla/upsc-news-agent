name: Daily Indian Express UPSC Email

on:
  schedule:
    # 09:00 India time = 03:30 UTC
    - cron: "30 3 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "ie/agent.py"
      - "ie/requirements.txt"
      - "ie/check_agent.py"
      - ".github/workflows/indian-express.yml"

permissions:
  contents: write

concurrency:
  group: indian-express-daily-email
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ie/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ie/requirements.txt
      - name: Check article filtering and empty outcomes
        run: python ie/check_agent.py
      - name: Generate and email Indian Express report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER || secrets.SMTP_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD || secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT || secrets.EMAIL_TO }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          GEMINI_MODEL: ${{ vars.IE_GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          MAX_RELEASES: "25"
          PYTHONUNBUFFERED: "1"
        run: python ie/agent.py
      - name: Persist processed article history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ie/seen_article_ids.json
          if ! git diff --cached --quiet; then
            git commit -m "Save Indian Express article history [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: indian-express-report-${{ github.run_id }}
          path: ie/*.pdf
          if-no-files-found: ignore
          retention-days: 7
